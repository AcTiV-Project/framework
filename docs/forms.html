<!DOCTYPE html>
<html lang="en">
<head>
    <!--Style CSS-->
    <link rel="stylesheet" href="/dist/aceleracss.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <div class="login form--1 f-flex-center">
        <form action="" class="login__form f-flex-column color-blue">
            <label for="Name">Name</label>
            <input type="text" placeholder="Name">

            <label for="Password">Password</label>
            <input type="password" name="password" id="" placeholder="Password">

            <input type="submit" class="submit" value="Login">
            
            <a href="#">Don't you have an account?</a>
        </form>
    </div>


    <div class="login form--2 f-flex-center">
        <form action="" class="login__form f-flex-column color-blue">
            <label for="Name">Name</label>
            <input type="text" placeholder="Name">

            <label for="Email">Email</label>
            <input type="email" name="email" id="" placeholder="Email Address">

            <label for="Password">Password</label>
            <input type="password" name="password" id="" placeholder="Password">

            <label for="Password">Repeat Password</label>
            <input type="password" name="repeat_password" id="" placeholder="Repeat Password">

            <input type="submit" class="submit" value="Create Accound">
            
            <a href="#">Already have an account? Log in</a>
        </form>
    </div>
</body>
</html>
